# Qrisgg — Docker Compose for Ubuntu 24.04 VPS (/opt/qrisgg). Usage: see docs/DEPLOYMENT.md
name: qrisgg

services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 600m

  backend:
    build: { context: ../backend }
    image: qrisgg-backend:latest
    restart: unless-stopped
    env_file: ./.env.backend
    depends_on:
      mongo: { condition: service_healthy }
    networks: [internal]
    mem_limit: 400m
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_API_URL}
    image: qrisgg-frontend:latest
    restart: unless-stopped
    networks: [internal]
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/qrisgg.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend]
    networks: [internal]
    mem_limit: 64m

networks:
  internal: {}

volumes:
  mongo_data: {}
