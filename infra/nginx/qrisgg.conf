# TLS: Cloudflare Origin Certificate placed at infra/certs/origin.pem + origin.key (Cloudflare SSL mode: Full (strict)).
server {
    listen 80;
    server_name qrisgg.com www.qrisgg.com api.qrisgg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.qrisgg.com;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    return 301 https://qrisgg.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qrisgg.com;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name api.qrisgg.com;
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Replace with Cloudflare ranges from https://www.cloudflare.com/ips/ (one set_real_ip_from per range).
    set_real_ip_from 173.245.48.0/20;
    real_ip_header CF-Connecting-IP;

    location /v1/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8001/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
